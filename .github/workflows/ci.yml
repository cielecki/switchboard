name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10
      - run: uv run --python ${{ matrix.python-version }} python -m unittest discover -s tests -v
      - if: matrix.python-version == '3.12'
        run: uv build
      - if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/switchboard-acceptance
          /tmp/switchboard-acceptance/bin/pip install dist/*.whl
          /tmp/switchboard-acceptance/bin/python scripts/acceptance.py \
            --switchboard /tmp/switchboard-acceptance/bin/switchboard
      - if: matrix.python-version == '3.12'
        run: npx --yes @anthropic-ai/claude-code plugin validate plugins/switchboard
      - if: matrix.python-version == '3.12'
        run: npx --yes @anthropic-ai/claude-code plugin validate .claude-plugin/marketplace.json
