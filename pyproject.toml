[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-switchboard"
version = "0.4.4"
description = "CLI-managed routing tables, processor outcomes, and durable waits for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Maciej Cielecki" }]
keywords = ["agents", "events", "routing", "cli", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
switchboard = "switchboard.cli:main"

[project.urls]
Homepage = "https://github.com/cielecki/switchboard"
Repository = "https://github.com/cielecki/switchboard"
Issues = "https://github.com/cielecki/switchboard/issues"

[tool.hatch.build.targets.wheel]
packages = ["plugins/switchboard/src/switchboard"]
